[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bildarchiv"
version = "0.1.0"
description = "Bildsammlungen analysieren, ordnen, Dubletten finden und eindeutig benennen – mit Menü im Terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "Pillow>=9", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bildarchiv = "bildarchiv.__main__:main"

[tool.setuptools.packages.find]
include = ["bildarchiv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
